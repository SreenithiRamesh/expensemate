spring.datasource.url=jdbc:h2:mem:expensemate_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=false

jwt.secret=VGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItZXhwZW5zZW1hdGU=
jwt.expiration-ms=900000

# Gemini test configuration
gemini.api-key=test-gemini-api-key
gemini.model=test-gemini-model
gemini.daily-limit=10


# M21 - Higher limits for ordinary integration tests.
# Dedicated rate-limit tests override these with smaller values.
app.rate-limit.auth.requests-per-minute=1000
app.rate-limit.api.requests-per-minute=1000

# M22 - Gemini resilience
# Production behavior is configured in application.properties.
# Unit tests instantiate the resilience executor directly with
# shorter delays where deterministic testing is required.
gemini.resilience.retry.max-attempts=3
gemini.resilience.retry.initial-delay-ms=1
gemini.resilience.circuit-breaker.failure-threshold=5
gemini.resilience.circuit-breaker.open-duration-seconds=1

# M24 - Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

management.info.env.enabled=true
info.app.name=ExpenseMate
info.app.description=Personal and shared expense management API
info.app.version=test

management.metrics.tags.application=expensemate-backend

# M27 - Database query-count measurement
spring.jpa.properties.hibernate.generate_statistics=true