spring.application.name=expensemate-backend

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true

spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000
auth.refresh-token.expiration-days=7

# Gemini AI
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.daily-limit=${GEMINI_DAILY_LIMIT:10}


# ============================================================
# M22 - Gemini Resilience
# ============================================================

# Maximum total attempts, including the first call.
gemini.resilience.retry.max-attempts=3

# Exponential retry delays:
# 500 ms before retry 2
# 1000 ms before retry 3
gemini.resilience.retry.initial-delay-ms=500

# Open the circuit after 5 recorded provider failures.
gemini.resilience.circuit-breaker.failure-threshold=5

# Keep the circuit open before allowing a half-open probe.
gemini.resilience.circuit-breaker.open-duration-seconds=30

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

management.info.env.enabled=true
info.app.name=ExpenseMate
info.app.description=Personal and shared expense management API
info.app.version=@project.version@

management.metrics.tags.application=expensemate-backend

# ============================================================
# M24 - Observability
# ============================================================

# Include the request correlation ID in every application log.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-none}] %logger{36} - %msg%n

