name: expensemate

services:
  postgres:
    image: postgres:17-alpine
    container_name: expensemate-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - expensemate_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: expensemate-backend:m26
    container_name: expensemate-backend
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-10}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 8080
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  expensemate_postgres_data:
    name: expensemate_postgres_data